name: 社説まとめサイトをGitHub Pagesに公開

on:
  schedule:
    # 05:10 JST と 11:10 JST と 19:10 JST（cronはUTC指定）
    - cron: "10 2,10,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py today

      - name: アーカイブスナップショットをdataブランチに保存
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(ls output/*-today.json)
          day="$(basename "$src" -today.json)"
          data_dir="$RUNNER_TEMP/data-branch"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git clone --branch data --single-branch "$repo_url" "$data_dir"
          else
            git clone --single-branch "$repo_url" "$data_dir"
            git -C "$data_dir" checkout --orphan data
            git -C "$data_dir" rm -rf . > /dev/null
          fi

          mkdir -p "$data_dir/archive"
          python append_archive_day.py "$data_dir/archive" "$src"
          python build_archive_index.py "$data_dir/archive"

          git -C "$data_dir" config user.name "github-actions[bot]"
          git -C "$data_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$data_dir" add archive/
          if ! git -C "$data_dir" diff --cached --quiet; then
            git -C "$data_dir" commit -m "chore: アーカイブスナップショットを追加 ($day)"
            git -C "$data_dir" push origin data
          fi

          echo "DATA_DIR=$data_dir" >> "$GITHUB_ENV"

      - run: python main.py archive-page

      - run: |
          mkdir -p _site
          cp output/today.html _site/index.html
          cp output/archive.html _site/archive.html
          cp -r "$DATA_DIR/archive" _site/archive
          cp static/robots.txt _site/robots.txt
          cp static/sitemap.xml _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
