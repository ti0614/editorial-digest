name: 当日版をGitHub Pagesに公開

on:
  schedule:
    # 05:10 JST と 11:10 JST と 19:10 JST（cronはUTC指定）
    - cron: "10 2,10,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py today

      - run: |
          mkdir -p _site
          cp output/today.html _site/index.html
          cp static/robots.txt _site/robots.txt
          cp static/sitemap.xml _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
