name: 社説まとめサイトをGitHub Pagesに公開

on:
  schedule:
    # 05:10 JST と 11:10 JST と 19:10 JST（cronはUTC指定）
    - cron: "10 2,10,20 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "各紙の再取得をせず、既存データからarchive.htmlのみ再生成して公開する（today.htmlは公開中のものを再利用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 各紙を巡回して当日分を取得
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        run: python main.py today

      - name: dataブランチをチェックアウト
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data_dir="$RUNNER_TEMP/data-branch"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git clone --branch data --single-branch "$repo_url" "$data_dir"
          else
            git clone --single-branch "$repo_url" "$data_dir"
            git -C "$data_dir" checkout --orphan data
            git -C "$data_dir" rm -rf . > /dev/null
          fi
          mkdir -p "$data_dir/archive"

          echo "DATA_DIR=$data_dir" >> "$GITHUB_ENV"

      # skip_scrape時はoutput/*-today.jsonが存在しないため、当日分の追記自体を
      # 行わない（archive/はdataブランチの既存データのまま、archive.htmlだけを
      # 現在のコードで再生成する）。
      - name: 当日分をアーカイブへマージ
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(ls output/*-today.json)
          day="$(basename "$src" -today.json)"
          python append_archive_day.py "$DATA_DIR/archive" "$src"
          python build_archive_index.py "$DATA_DIR/archive"

          git -C "$DATA_DIR" config user.name "github-actions[bot]"
          git -C "$DATA_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$DATA_DIR" add archive/
          if ! git -C "$DATA_DIR" diff --cached --quiet; then
            git -C "$DATA_DIR" commit -m "chore: アーカイブスナップショットを追加 ($day)"
            git -C "$DATA_DIR" push origin data
          fi

      # 各紙を再取得しない代わりに、公開中のtoday.htmlをそのまま使い回す。
      - name: 公開中のtoday.htmlを再利用
        if: ${{ github.event.inputs.skip_scrape == 'true' }}
        run: |
          mkdir -p output
          curl -fsSL https://ti0614.github.io/editorial-digest/ -o output/today.html

      - run: python main.py archive-page

      - run: |
          mkdir -p _site
          cp output/today.html _site/index.html
          cp output/archive.html _site/archive.html
          cp -r "$DATA_DIR/archive" _site/archive
          cp static/robots.txt _site/robots.txt
          cp static/sitemap.xml _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
