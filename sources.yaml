# 各紙の社説（オピニオン）一覧ページの設定
#
# 2026-07-21: ネットワークアクセス可能な環境で実際の各紙HTMLを取得し、
# URL・CSSセレクタを実機確認・修正済み（verified: true の項目）。
# ただしニュースサイトはリニューアルでHTML構造が変わることがあるため、
# 定期的に `python main.py check` で疎通確認することを推奨します。
#
# 各項目の意味:
#   name        : 新聞社名（表示用）
#   category    : この社の論説コラムの呼称（社説 / 主張 など）
#   tier        : national（全国紙）/ regional（ブロック紙・地方紙）。
#                 生成するWebページで「全国紙をメイン表示、他はトグルで表示」
#                 を切り分けるために使う。省略時は regional 扱い。
#   index_url   : 社説一覧ページのURL
#   item_selector  : 一覧ページ内の「記事1件」を指すCSSセレクタ
#   title_selector : item_selector の中でタイトルを含む要素（省略時はitem自体のテキスト）
#   link_selector  : item_selector の中でリンク(<a>)を指すセレクタ（省略時はitem自体がaタグ）
#   date_selector  : 日付を含む要素（任意、なければ省略可）
#   title_exclude_selector : タイトル内から除去する要素（任意。"New"バッジ等の混入除去用）
#   verified    : false の場合、実機未検証（要確認）であることを示す

sources:
  # ---- 全国紙（主要5紙） ----
  - name: 朝日新聞
    category: 社説
    tier: national
    index_url: https://www.asahi.com/rensai/list.html?id=16
    item_selector: "li:has(h3)"
    title_selector: "h3"
    link_selector: "a"
    date_selector: "p:last-of-type span"
    verified: true

  - name: 毎日新聞
    category: 社説
    tier: national
    index_url: https://mainichi.jp/editorial/
    item_selector: "ul.articlelist li"
    title_selector: "h3.articlelist-title"
    link_selector: "a"
    date_selector: "span.articletag-date"
    verified: true

  - name: 読売新聞
    category: 社説
    tier: national
    index_url: https://www.yomiuri.co.jp/editorial/
    item_selector: "div.list div.item"
    title_selector: "h3.title"
    link_selector: "h3.title a"
    date_selector: "time"
    verified: true

  - name: 日本経済新聞
    category: 社説
    tier: national
    index_url: https://www.nikkei.com/opinion/editorial/
    item_selector: "article"
    title_selector: "h2"
    link_selector: "h2 a"
    date_selector: "time"
    verified: true
    note: "本文は会員限定（有料）。タイトル・リンクのみ取得想定。robots.txtはCCBot/GPTBot等AI学習系クローラーを明示的に拒否しているが、User-agent: * では本ページを許可しているため取得対象としている。"

  - name: 産経新聞
    category: 主張
    tier: national
    index_url: https://www.sankei.com/column/editorial/
    item_selector: "div.col-container.col-12 article.storycard"
    title_selector: "h3.headline"
    link_selector: "h3.headline a"
    date_selector: "time.storycard__time"
    verified: true
    note: "産経では社説にあたるコラムは「主張」という名称。旧URL（/newstopics/editorial/）は廃止されており、正しくは /column/editorial/ 。article.storycard はページ内の「おすすめ記事」枠（3カラムグリッド）にも使われるため、本文一覧のコンテナ（col-12の1カラム部分）に絞り込んでいる。"

  # ---- 地方紙・専門紙（順次拡充） ----
  - name: 東京新聞
    category: 社説
    tier: regional
    index_url: https://www.tokyo-np.co.jp/n/column/editorial
    item_selector: 'div.detail:has(a[href*="rct=editorial"])'
    title_selector: "p.detail-ttl"
    link_selector: "p.detail-ttl a"
    date_selector: "span.detail-info-txt"
    verified: true
    note: "中日新聞（東京本社）。中日新聞と社説を共有。旧URL（/list/editorial）は廃止。div.detail はページ内の関連記事枠にも使われるため、リンクに rct=editorial を含むものだけに絞っている。"

  - name: 中日新聞
    category: 社説
    tier: regional
    index_url: https://www.chunichi.co.jp/wadai/opinion/editorial
    item_selector: 'div.detail:has(a[href*="rct=editorial"])'
    title_selector: "p.detail-ttl"
    link_selector: "p.detail-ttl a"
    date_selector: "span.detail-info-txt"
    verified: true
    note: "東京新聞と同一の社説を掲載。旧URL（/list/syasetsu/）は廃止。div.detail は関連記事枠にも使われるため rct=editorial で絞り込み。"

  - name: 北海道新聞
    category: 社説
    tier: regional
    index_url: https://www.hokkaido-np.co.jp/tags/editorial/
    item_selector: "div.post_list.post_list-type_thm_bg-m div.post_item"
    title_selector: "div.post_title"
    link_selector: "div.post_title a"
    date_selector: "div.post_date"
    verified: true
    note: "旧URL（/list/editorial）は廃止、正しくは /tags/editorial/ 。div.post_item はページ下部のアクセスランキング等にも使われるため、社説一覧本体のコンテナに絞り込んでいる。"

  - name: 西日本新聞
    category: 社説
    tier: regional
    index_url: https://www.nishinippon.co.jp/category/column/editorial/
    item_selector: "article"
    title_selector: "h2"
    title_exclude_selector: "span"
    link_selector: "h2 a"
    date_selector: "div.gap-x-1 span"
    verified: true
    note: "旧URL（/theme/editorial/）は廃止、正しくは /category/column/editorial/ 。新着記事には見出し内に「New」バッジ（span）が付き、そのままだとタイトル末尾に混入するため title_exclude_selector で除去している。"

  - name: 京都新聞
    category: 社説
    tier: regional
    index_url: https://www.kyoto-np.co.jp/category/editorial
    item_selector: 'article.m-articles-item:not([class*="--"])'
    title_selector: "h3.m-articles-item__info-ttl"
    link_selector: "a"
    date_selector: "time.m-articles-item__info-date"
    verified: true
    note: "ページ内には関連ランキング等（class末尾に --ranking 等の修飾子付き）も同居しているため、修飾子なしの記事のみに絞るセレクタにしている。"

  - name: 神戸新聞
    category: 社説
    tier: regional
    index_url: https://www.kobe-np.co.jp/rentoku/shasetsu/
    item_selector: 'div.detail:has(a.caption[href*="/opinion/"])'
    title_selector: "a.caption"
    link_selector: "a.caption"
    date_selector: "time.meta-time"
    verified: true
    note: "旧URL（/rensai/syasetsu/）は廃止、正しくは /rentoku/shasetsu/ 。div.detail はページ下部の一般ニュース枠にも使われるため、記事リンクが /opinion/ 配下のものだけに絞っている。"

  - name: 河北新報
    category: 社説
    tier: regional
    index_url: https://kahoku.news/tag/%E7%A4%BE%E8%AA%AC
    item_selector: "li.vr2_articleslist__item"
    title_selector: "h2.vr2_articleslist__title"
    link_selector: "a.vr2_articleslist__unit"
    date_selector: "time"
    verified: false
    note: "URL・セレクタ自体は実機確認済みだが、robots.txt が /tag/ 配下を（一部タグを除き）禁止しており「社説」タグは許可リストに無いため、本ツールは robots.txt に従い自動的にスキップする（意図した動作）。取得したい場合は運営元に許諾を確認してください。"

  - name: 中国新聞
    category: 社説
    tier: regional
    index_url: https://www.chugoku-np.co.jp/list/editorial/
    item_selector: "li.article-list-item"
    title_selector: ".headline, h3"
    link_selector: "a"
    date_selector: "time"
    verified: false
    note: "社説単独の一覧ページを発見できなかった（要調査）。トップページの「オピニオン」枠には社説が単発で表示されるが、専用の一覧URLは見つからず、/feature/genre/オピニオン はコラム等混在のジャンルページで社説のみに絞れない。ネットワークアクセス可能な環境で再調査が必要。"

  # ---- 地方紙（東北ブロック、県紙を1紙ずつ） ----
  - name: 東奥日報
    category: 時論
    tier: regional
    index_url: https://www.toonippo.co.jp/category/editorial
    item_selector: "ul.article-list li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: true
    note: "青森県。論説コラムの呼称は「時論」。/category/editorial は時論専用ページで他コラムとの混在なし。"

  - name: 秋田魁新報
    category: 社説
    tier: regional
    index_url: https://www.sakigake.jp/news/list/scd/100003000/
    item_selector: 'div.p-articles__item:has(h2.c-article-module__heading:-soup-contains("社説"))'
    title_selector: "h2.c-article-module__heading"
    link_selector: "a.c-article-module__link"
    date_selector: "time.c-article-module__note"
    verified: true
    note: "秋田県。このURLは「社説・コラム」混在ページ（コラム「北斗星」等も含む）のため、見出しに「社説」を含む記事だけに絞り込んでいる。"

  - name: 山形新聞
    category: 社説
    tier: regional
    index_url: https://www.yamagata-np.jp/column/
    item_selector: "#shasetsu_area"
    title_selector: "h3"
    link_selector: "p a"
    date_selector: "h2 span"
    verified: true
    note: "山形県。このページは「本日の社説」1件のみを表示する形式（一覧ページではない）で、他紙のように直近1週間分がまとめて並んでいるわけではない。1回の取得につき最新1件のみ取得できる。"

  - name: 福島民報
    category: 論説
    tier: regional
    index_url: https://www.minpo.jp/subcategory/ronsetsu
    item_selector: "article.m-article-list__item"
    title_selector: "h2.m-article__ttl"
    link_selector: "a.m-article"
    date_selector: "time.c-time"
    verified: true
    note: "福島県。論説コラムの呼称は「論説」。同名紙に福島民友（minyu-net.com）もあるが、本ツールで採用しているのは福島民報（minpo.jp）。最新1件のみ日付が「22時間前」等の相対表記になっており日付が解釈できない場合があるが、取りこぼしを避けるため対象に含めている。"

  - name: 岩手日報
    category: 社説
    tier: regional
    index_url: https://www.iwate-np.co.jp/
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "岩手県。社説・論説の専用一覧ページを発見できなかった（要調査）。ホームページ内にも社説へのリンクが見当たらず、/article/category/{editorial,syasetsu,ronsetsu,column,opinion} 等の候補URLもすべて404。ネットワークアクセス可能な環境で構造の再調査が必要。"

  # ---- 地方紙（関東ブロック、東京は既存の東京新聞で対応済み） ----
  - name: 下野新聞
    category: 論説
    tier: regional
    index_url: https://www.shimotsuke.co.jp/category/column-opinion-Editorial
    item_selector: "ul.article-category-list li"
    title_selector: "p.title"
    link_selector: "a"
    date_selector: "p.date"
    verified: true
    note: "栃木県。論説コラムの呼称は「論説」。"

  - name: 神奈川新聞
    category: 社説
    tier: regional
    index_url: https://www.kanaloco.jp/special/discourse/editorial/
    item_selector: "section.cont"
    title_selector: "h3.hdg span.title"
    link_selector: "a"
    date_selector: "p.info"
    verified: true
    note: "カナロコ by 神奈川新聞。section.cont はこのページの他要素にも使われるが、h3.hdg（記事タイトル）を持たない要素は main.py 側で自動的にスキップされるため実害はない。"

  - name: 茨城新聞
    category: 論説
    tier: regional
    index_url: "https://ibarakinews.jp/news/newsdetail.php?elem=ronsetu"
    item_selector: "body"
    title_selector: "h1.post-title"
    link_selector: 'a[href="https://ibarakinews.jp/news/newsdetail.php?elem=ronsetu"]'
    date_selector: "div.post-updated"
    verified: true
    note: "茨城新聞クロスアイ。論説コラムの呼称は「論説」。このURLは常に「最新の論説1件」を表示するページ（過去分の一覧ではない）で、記事本体へのパーマリンクも見当たらないため、item_selector は body 全体を1件として扱っている。robots.txt が Crawl-delay: 30 を指定しているため、他紙より間隔を空けてアクセスすること。"

  - name: 上毛新聞
    category: 社説
    tier: regional
    index_url: https://www.jomo-news.co.jp/
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "群馬県。社説の専用一覧ページを発見できなかった（要調査）。ホームページ内に社説・論説へのリンクが見当たらず、候補URL（/category/editorial 等）もすべて404。"

  - name: 埼玉新聞
    category: 社説
    tier: regional
    index_url: https://www.saitama-np.co.jp/
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "埼玉県。ホームページ内に「社説」「論説」の文言が一切見当たらず、専用ページを特定できなかった（要調査）。"

  - name: 千葉日報
    category: 社説
    tier: regional
    index_url: https://www.chibanippo.co.jp/
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "千葉県。調査時点でサイトが 500/504 エラーを返し続けており、ホームページ自体を取得できなかった（一時的な障害の可能性。後日再調査が必要）。"

  # ---- 地方紙（甲信越・北陸ブロック） ----
  - name: 新潟日報
    category: 社説
    tier: regional
    index_url: https://www.niigata-nippo.co.jp/category/editorial
    item_selector: "div.m-article"
    title_selector: "a.m-article__ttl"
    link_selector: "a.m-article__ttl"
    date_selector: "time.c-date"
    verified: true
    note: "新潟県。"

  - name: 北日本新聞
    category: 社説
    tier: regional
    index_url: "https://webun.jp/feature/special/%E7%A4%BE%E8%AA%AC"
    item_selector: "article.m-article-list"
    title_selector: "div.m-article-list-ttl"
    link_selector: "a"
    date_selector: "div.m-article-list-date"
    verified: true
    note: "富山県。デジタル版ブランド名は「webun」。タイトル要素に「社説」ラベルと本文が改行区切りで同居しており、取得結果は先頭に「社説」が付く。"

  - name: 北國新聞
    category: 社説
    tier: regional
    index_url: https://www.hokkoku.co.jp/category/editorial
    item_selector: 'a.u-block-link.u-no-underline.u-no-opacity:has(div.m-articles-item)'
    title_selector: "h3"
    date_selector: "time.m-articles-item__info-date"
    verified: true
    note: "石川県。item自体が記事へのリンク(<a>)のため link_selector は省略。1日に2本社説を掲載することが多い（重複ではなく別記事）。"

  - name: 福井新聞
    category: 論説
    tier: regional
    index_url: https://www.fukuishimbun.co.jp/category/editorial
    item_selector: "div.article.clearfix"
    title_selector: "div.title span.main-title"
    link_selector: "div.title a"
    date_selector: "div.title span.date"
    verified: true
    note: "福井県。論説コラムの呼称は「論説」。"

  - name: 山梨日日新聞
    category: 論説
    tier: regional
    index_url: https://www.sannichi.co.jp/news/ronsetsu
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "山梨県。AWS WAF（x-amzn-waf-action: challenge）によりbotアクセスがブロックされ、通常のHTTPリクエストではページを取得できない（要JS実行環境）。ブラウザ自動化なしでの回避は行っていない。"

  - name: 信濃毎日新聞
    category: 社説
    tier: regional
    index_url: https://www.shinmai.co.jp/top/opinion
    item_selector: "li.article"
    title_selector: "span.title"
    link_selector: "a"
    date_selector: "span.date"
    verified: false
    note: "長野県。ページ内に「オピニオン」一覧の入り口はあるものの、記事データがNext.jsのハイドレーション用JSON（__APOLLO_STATE__）に埋め込まれており、静的HTML上にCSSセレクタで拾えるタイトル・リンクが存在しない（要調査、JSON解析による別実装が必要）。"
