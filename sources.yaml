# 各紙の社説（オピニオン）一覧ページの設定。
#
# 対象は全国紙5紙（朝日・毎日・読売・日経・産経）のみで恒久的に固定している。
# 以前はブロック紙・地方紙も収録し、tier（national/block/regional）フィールドで
# 区別していたが、2026-08-12にtier概念ごと廃止した（経緯は CLAUDE.md 参照）。
# 旧構成一式（tier・paid_selector・always_paid を含む全エントリ）は
# archive/all-tiers-sources ブランチにそのまま残っており、参照できる。
#
# 2026-07-21: ネットワークアクセス可能な環境で実際の各紙HTMLを取得し、
# URL・CSSセレクタを実機確認・修正済み（verified: true の項目）。
# ただしニュースサイトはリニューアルでHTML構造が変わることがあるため、
# 定期的に `python main.py check` で疎通確認することを推奨します。
#
# 各項目の意味:
#   name        : 新聞社名（表示用）
#   category    : この社の論説コラムの呼称（社説 / 主張 など）
#   index_url   : 社説一覧ページのURL
#   item_selector  : 一覧ページ内の「記事1件」を指すCSSセレクタ
#   title_selector : item_selector の中でタイトルを含む要素（省略時はitem自体のテキスト）
#   link_selector  : item_selector の中でリンク(<a>)を指すセレクタ（省略時はitem自体がaタグ）
#   date_selector  : 日付を含む要素（任意、なければ省略可）
#   title_exclude_selector : タイトル内から除去する要素（任意。"New"バッジ等の混入除去用）
#   title_prefix  : 指定すると、タイトルがこの文字列で始まらない記事を除外する（任意）。
#                 社説専用の一覧ページが無く、サイト内全文検索の結果を index_url に
#                 使う紙向け（例: 岐阜新聞の検索結果には「会社説明会」等、社説と
#                 無関係な記事も紛れ込むため、これで弾く）。
#   title_strip_pattern : タイトルから正規表現にマッチした部分を除去する（任意）。
#                 全文検索結果はタイトルに「社説　」という接頭辞や「〈2026 7.26〉」
#                 のような日付が埋め込まれていることがあり、他紙と表記を揃えるために使う。
#   verified    : false の場合、実機未検証（要確認）であることを示す

sources:
  - name: 朝日新聞
    category: 社説
    index_url: https://www.asahi.com/rensai/list.html?id=16
    item_selector: "li:has(h3)"
    title_selector: "h3"
    link_selector: "a"
    date_selector: "p:last-of-type span"
    pagination_param: page
    verified: true
    note: "2026-07-22訂正: 一時期 always_paid にしていたが誤り。記事個別ページ上部の「有料会員になると会員限定の有料記事もお読みいただけます」は購読促進バナーであり、本文自体は別のdiv（クラス名 nfyQp 等）に完全な形で存在し無料で読める（5記事で確認）。2026-07-26: 一覧ページに?id=16&page=Nのページ送りがあり151ページまで確認（pagination_param: page）。backfill_archive.py実行時のみ使用、通常のcheck/run/todayでは1ページ目のみで足りるため使わない。"

  - name: 毎日新聞
    category: 社説
    index_url: https://mainichi.jp/editorial/
    item_selector: "ul.articlelist li"
    title_selector: "h3.articlelist-title"
    link_selector: "a"
    date_selector: "span.articletag-date"
    pagination_path_template: "/editorial/{page}"
    pagination_headers:
      X-Requested-With: XMLHttpRequest
    pagination_wrap_fragment: true
    verified: true

  - name: 読売新聞
    category: 社説
    index_url: https://www.yomiuri.co.jp/editorial/
    item_selector: "div.list div.item"
    title_selector: "h3.title"
    link_selector: "h3.title a"
    date_selector: "time"
    pagination_path_template: "/y_ajax/latest_list/category/45/1/0/24//editorial/{page}/"
    pagination_page_offset: -1
    pagination_response_json_field: contents
    pagination_wrap_fragment: true
    verified: true
    note: "「さらに読み込む」ボタンはAJAX（/y_ajax/latest_list/.../{N}/、Nは1始まり）で次の10件をJSON({\"contents\": HTML断片, \"has_next_data\": bool})で返す。一覧ページ本体（div.list div.item、最大26件程度）の末尾記事と、AJAX 1ページ目の先頭記事が記事IDの連番で正確に連続していることを確認済み（隙間なし、2026-07-26確認）。AJAX応答のHTML断片には外側の<div class=\"list\">が無いため、item_selectorの先頭トークンから組み立てて包み直す（pagination_wrap_fragment）。10ページ目（has_next_data: false）の次で404。"

  - name: 日本経済新聞
    category: 社説
    index_url: https://www.nikkei.com/opinion/editorial/
    item_selector: "article"
    title_selector: "h2"
    link_selector: "h2 a"
    date_selector: "time"
    pagination_param: page
    verified: true
    note: "本文は会員限定（有料）。タイトル・リンクのみ取得想定。robots.txtはCCBot/GPTBot等AI学習系クローラーを明示的に拒否しているが、User-agent: * では本ページを許可しているため取得対象としている。"

  - name: 産経新聞
    category: 主張
    index_url: https://www.sankei.com/column/editorial/
    item_selector: "div.col-container.col-12 article.storycard"
    title_selector: "h3.headline"
    link_selector: "h3.headline a"
    date_selector: "time.storycard__time"
    pagination_json_url_template: "https://www.sankei.com/pf/api/v3/content/fetch/story-feed-by-sections?query=%7B%22includeSections%22%3A%22/column/editorial%22%2C%22paywallTypes%22%3A%22free%2Cfree_members%2Cpaid_members%22%2C%22feedSize%22%3A30%2C%22feedOffset%22%3A{offset}%7D&d=1167&_website=sankei"
    pagination_offset_base: 4
    pagination_offset_step: 30
    pagination_json_items_path: content_elements
    pagination_json_title_field: headlines.basic
    pagination_json_link_field: websites.sankei.website_url
    pagination_json_date_field: display_date
    verified: true
    note: "産経では社説にあたるコラムは「主張」という名称。旧URL（/newstopics/editorial/）は廃止されており、正しくは /column/editorial/ 。article.storycard はページ内の「おすすめ記事」枠（3カラムグリッド）にも使われるため、本文一覧のコンテナ（col-12の1カラム部分）に絞り込んでいる。一覧ページはFusion CMS（Arc Publishing）製で、「もっと見る」相当のページ送りはHTMLではなくJSON配列を返すcontent-api（/pf/api/v3/content/fetch/story-feed-by-sections）。一覧ページ本体は別ウィジェット由来の4件のみを表示しており、JSON APIのfeedOffsetはページ埋め込みのfeedConfigで4から始まる設定になっている（本体の直後から続くことを記事IDで確認済み、隙間なし）。feedSize=30刻みでoffsetを進める。"
